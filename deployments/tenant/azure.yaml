# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.13'
name: state-street-tenant-aware-agent
hooks:
  prepackage:
    shell: pwsh
    run: ./sync-agent.ps1
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 5
  craigslist-agent-tenant:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Responses Protocol
        - Private Networking
        - Foundry Toolbox
        - Entra Delegated Identity
        - Tenant-aware MCP Broker
    project: .azd-src/agent
    language: python
    docker:
      path: Dockerfile
      remoteBuild: true
    uses:
      - ai-project
    kind: hosted
    name: craigslist-agent-tenant
    displayName: State Street Tenant-aware MCP Agent
    description: Uses Foundry native sessions and delegated identity through a private MCP broker Toolbox.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PRIVATE_FOUNDRY_GATEWAY_ENDPOINT: ${PRIVATE_FOUNDRY_GATEWAY_ENDPOINT}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME=gpt-5.4-mini}
      TENANT_BROKER_TOOLBOX_ENDPOINT: ${TOOLBOX_ENDPOINT}
      TENANT_BROKER_TOOLBOX_ALLOWED_TOOLS: ${TOOLBOX_ALLOWED_TOOLS}
      TOOLBOX_NAME: ${TOOLBOX_NAME=tenant-broker-proof}
      PLAYWRIGHT_TOOLBOX_ENDPOINT: ${PLAYWRIGHT_TOOLBOX_ENDPOINT}
      PLAYWRIGHT_TOOLBOX_ALLOWED_TOOLS: ${PLAYWRIGHT_TOOLBOX_ALLOWED_TOOLS}
      ENABLE_FOUNDRY_WEB_SEARCH: 'false'
      ENABLE_SANDBOX_SEARCH: 'false'
      ENABLE_INSTRUMENTATION: 'true'
      ENABLE_SENSITIVE_DATA: 'false'
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRIC_EXPORT_INTERVAL: '10000'
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
