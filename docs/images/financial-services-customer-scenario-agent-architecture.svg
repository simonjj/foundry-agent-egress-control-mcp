<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Financial Services Customer Scenario Foundry agent reference architecture</title>
  <desc id="desc">A rendered architecture showing the user, Microsoft Foundry hosted agent, Azure API Management, Foundry model and web search, ACA Sandbox Python interpreter, Azure Playwright Workspace, preserved browser fallback, Azure Container Registry, and Application Insights.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a33"/>
      <stop offset="1" stop-color="#123a63"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5fc7"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="azure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#00a4ef"/>
    </linearGradient>
    <linearGradient id="sandbox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#008272"/>
      <stop offset="1" stop-color="#00b294"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#9bdcff"/>
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#9aaec2"/>
    </marker>
    <style>
      .heading { font: 700 34px "Segoe UI", Arial, sans-serif; fill: #fff; }
      .subheading { font: 400 17px "Segoe UI", Arial, sans-serif; fill: #c9e7ff; }
      .group { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #b9daf2; letter-spacing: 1px; }
      .card-title { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #fff; }
      .card-text { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #e8f5ff; }
      .label { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #d9efff; }
      .small { font: 400 12px "Segoe UI", Arial, sans-serif; fill: #c0d9e9; }
      .card { rx: 18; filter: url(#shadow); }
      .line { stroke: #9bdcff; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #9aaec2; stroke-width: 3; stroke-dasharray: 10 9; fill: none; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect width="1600" height="920" fill="url(#background)"/>
  <circle cx="1450" cy="90" r="190" fill="#1d5d89" opacity=".22"/>
  <circle cx="90" cy="850" r="240" fill="#5b5fc7" opacity=".12"/>

  <text x="70" y="64" class="heading" style="font-size: 28px">Financial Services Customer Scenario Foundry Agent Reference Architecture</text>
  <text x="70" y="96" class="subheading">Governed model access, isolated Python execution, public-web grounding, browser automation, and end-to-end telemetry</text>

  <rect x="45" y="130" width="1510" height="720" rx="30" fill="#071727" stroke="#39769f" stroke-width="2" opacity=".82"/>

  <text x="82" y="176" class="group">CLIENT</text>
  <rect class="card" x="75" y="200" width="190" height="125" fill="#2b4258"/>
  <circle cx="125" cy="248" r="24" fill="#d8ecff"/>
  <circle cx="125" cy="240" r="9" fill="#2b4258"/>
  <path d="M107 267 Q125 249 143 267" stroke="#2b4258" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="162" y="245" class="card-title">User</text>
  <text x="100" y="298" class="card-text">Foundry portal or</text>
  <text x="100" y="318" class="card-text">Responses endpoint</text>

  <text x="350" y="176" class="group">AGENT AND GOVERNANCE</text>
  <rect class="card" x="340" y="200" width="300" height="170" fill="url(#agent)"/>
  <text x="375" y="244" class="card-title">Microsoft Foundry</text>
  <text x="375" y="271" class="card-title">Hosted Agent</text>
  <text x="375" y="305" class="card-text">craigslist-agent · hosted</text>
  <text x="375" y="328" class="card-text">Semantic tool routing</text>
  <text x="375" y="351" class="card-text">Read-only browser policy</text>

  <rect class="card" x="720" y="200" width="300" height="170" fill="url(#azure)"/>
  <text x="755" y="244" class="card-title">Azure API Management</text>
  <text x="755" y="280" class="card-text">Subscription-key ingress</text>
  <text x="755" y="303" class="card-text">Rate and token limits</text>
  <text x="755" y="326" class="card-text">Managed identity backend</text>
  <text x="755" y="349" class="card-text">Streaming Responses API</text>

  <text x="1095" y="176" class="group">FOUNDRY DATA PLANE</text>
  <rect class="card" x="1090" y="200" width="400" height="170" fill="#145f92"/>
  <text x="1125" y="244" class="card-title">Foundry Project and Model</text>
  <text x="1125" y="280" class="card-text">gpt-5.4-mini deployment</text>
  <text x="1125" y="303" class="card-text">Project managed identity</text>
  <rect x="1125" y="324" width="325" height="30" rx="15" fill="#082f50" opacity=".75"/>
  <text x="1144" y="345" class="label">Bing-backed web search</text>

  <path class="line" d="M265 262 H330"/>
  <text x="274" y="247" class="label">request</text>
  <path class="line" d="M640 262 H710"/>
  <text x="651" y="247" class="label">HTTPS</text>
  <path class="line" d="M1020 262 H1080"/>
  <text x="1023" y="247" class="label">MI</text>

  <text x="82" y="438" class="group">ISOLATED TOOLS</text>
  <rect class="card" x="75" y="462" width="360" height="190" fill="url(#sandbox)"/>
  <text x="110" y="505" class="card-title">ACA Sandbox Python MCP</text>
  <text x="110" y="541" class="card-text">Bearer-authenticated run_python</text>
  <text x="110" y="564" class="card-text">CPU, memory, process and time limits</text>
  <text x="110" y="587" class="card-text">Default-deny egress</text>
  <text x="110" y="610" class="card-text">Craigslist hosts only</text>
  <rect x="110" y="622" width="285" height="18" rx="9" fill="#006a5b"/>

  <rect class="card" x="485" y="462" width="360" height="190" fill="#7a3e9d"/>
  <text x="520" y="505" class="card-title">Azure Playwright Workspace</text>
  <text x="520" y="541" class="card-text">Active browser automation path</text>
  <text x="520" y="564" class="card-text">Project managed identity connection</text>
  <text x="520" y="587" class="card-text">Interactive page rendering/inspection</text>
  <text x="520" y="610" class="card-text">Read-only agent policy</text>

  <rect class="card" x="895" y="462" width="300" height="190" fill="#40566d" stroke="#91a7bb" stroke-width="2"/>
  <text x="930" y="505" class="card-title">Browser MCP Fallback</text>
  <text x="930" y="541" class="card-text">Separate ACA Sandbox</text>
  <text x="930" y="564" class="card-text">Playwright + bearer proxy</text>
  <text x="930" y="587" class="card-text">Preserved for rollback</text>
  <text x="930" y="610" class="card-text">Not wired to active agent</text>

  <rect class="card" x="1245" y="462" width="245" height="190" fill="#9b4f00"/>
  <text x="1280" y="505" class="card-title">Azure Container</text>
  <text x="1280" y="530" class="card-title">Registry</text>
  <text x="1280" y="566" class="card-text">Immutable workload images</text>
  <text x="1280" y="589" class="card-text">Managed-identity pull</text>
  <text x="1280" y="612" class="card-text">Premium SKU</text>

  <path class="line" d="M450 370 C420 410 310 420 260 452"/>
  <text x="272" y="417" class="label">MCP / bearer</text>
  <path class="line" d="M500 370 C525 410 610 420 650 452"/>
  <text x="548" y="417" class="label">browser tool</text>
  <path class="dash" d="M560 370 C675 410 955 420 1035 452"/>
  <text x="790" y="413" class="label">inactive rollback path</text>
  <path class="line" d="M1245 555 H1205"/>
  <path class="line" d="M1245 592 C1050 690 470 690 350 652"/>
  <text x="1050" y="688" class="label">image build/import</text>

  <text x="82" y="723" class="group">OBSERVABILITY</text>
  <rect class="card" x="75" y="745" width="1415" height="72" fill="#20384c"/>
  <text x="110" y="786" class="card-title">Application Insights + Log Analytics</text>
  <text x="560" y="783" class="card-text">OpenTelemetry traces · prompts/responses (demo setting) · token metrics · tool invocations · APIM metrics</text>

  <path class="dash" d="M490 370 V735"/>
  <path class="dash" d="M870 370 V735"/>
  <path class="dash" d="M1290 370 V735"/>

  <text x="77" y="882" class="small">Primary region: Central US · Playwright Workspace: West US 3 · Existing Sandbox resources are preserved and require explicit cleanup.</text>
</svg>
