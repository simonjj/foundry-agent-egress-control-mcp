<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150" role="img" aria-labelledby="title desc">
  <title id="title">Tenant-aware MCP solution call flow (v2)</title>
  <desc id="desc">End-to-end runtime flow through a broker Toolbox for customer Python tools and a separate approval-gated Toolbox for a shared Playwright Workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06172c"/>
      <stop offset="0.55" stop-color="#0a2b49"/>
      <stop offset="1" stop-color="#123f58"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5fc7"/>
      <stop offset="1" stop-color="#7d55d9"/>
    </linearGradient>
    <linearGradient id="toolbox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#00a4ef"/>
    </linearGradient>
    <linearGradient id="broker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c45418"/>
      <stop offset="1" stop-color="#e38b24"/>
    </linearGradient>
    <linearGradient id="sandbox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#008272"/>
      <stop offset="1" stop-color="#00a68a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#00101d" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#86dcff"/>
    </marker>
    <marker id="arrowGold" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#ffd166"/>
    </marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#65e6ae"/>
    </marker>
    <marker id="arrowPink" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#ff8dc7"/>
    </marker>
    <style>
      .title { font: 700 38px "Segoe UI", Arial, sans-serif; fill: #f7fcff; }
      .subtitle { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #bddced; }
      .zone-title { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #cdeeff; letter-spacing: 1.3px; }
      .card-title { font: 700 19px "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .card-copy { font: 400 13.5px "Segoe UI", Arial, sans-serif; fill: #e6f3fa; }
      .card-small { font: 600 12px "Segoe UI", Arial, sans-serif; fill: #d4ebf6; }
      .tag { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #06182c; }
      .legend { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #d4eaf5; }
      .zone { fill: #0a233b; stroke: #376b89; stroke-width: 2; }
      .card { stroke: #ffffff; stroke-opacity: 0.24; stroke-width: 1.5; filter: url(#shadow); }
      .request { fill: none; stroke: #86dcff; stroke-width: 4; marker-end: url(#arrowBlue); }
      .identity { fill: none; stroke: #ffd166; stroke-width: 4; marker-end: url(#arrowGold); }
      .secret { fill: none; stroke: #ff8dc7; stroke-width: 3.5; marker-end: url(#arrowPink); }
      .returnpath { fill: none; stroke: #65e6ae; stroke-width: 4; stroke-dasharray: 11 8; marker-end: url(#arrowGreen); }
      .web { fill: none; stroke: #ffd166; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrowGold); }
    </style>
  </defs>

  <rect width="1800" height="1150" fill="url(#bg)"/>
  <circle cx="1650" cy="55" r="230" fill="#2d7da0" opacity="0.12"/>
  <circle cx="80" cy="1080" r="260" fill="#7454db" opacity="0.10"/>

  <text x="64" y="60" class="title">Tenant-Aware MCP Solution — Runtime Call Flow</text>
  <text x="64" y="94" class="subtitle">One Hosted Agent, two Toolboxes: customer-routed Python/search and shared approval-gated Playwright</text>

  <!-- Lanes -->
  <rect x="40" y="130" width="260" height="790" rx="24" class="zone"/>
  <text x="66" y="164" class="zone-title">CALLER</text>

  <rect x="320" y="130" width="700" height="790" rx="24" class="zone"/>
  <text x="348" y="164" class="zone-title">MICROSOFT FOUNDRY</text>

  <rect x="1040" y="130" width="720" height="790" rx="24" class="zone"/>
  <text x="1068" y="164" class="zone-title">CUSTOMER-CONTROLLED PRIVATE TOOL PLANE</text>

  <!-- Caller card -->
  <rect x="70" y="320" width="200" height="200" rx="20" fill="#27445d" class="card"/>
  <circle cx="170" cy="372" r="26" fill="#d9edff"/>
  <circle cx="170" cy="364" r="9" fill="#27445d"/>
  <path d="M149 393 Q170 370 191 393" stroke="#27445d" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="170" y="425" text-anchor="middle" class="card-title">Authenticated user</text>
  <text x="170" y="454" text-anchor="middle" class="card-copy">Foundry playground or</text>
  <text x="170" y="475" text-anchor="middle" class="card-copy">Responses client</text>
  <text x="170" y="502" text-anchor="middle" class="card-small">Interactive OAuth consent</text>

  <!-- Agent card -->
  <rect x="356" y="290" width="290" height="250" rx="20" fill="url(#agent)" class="card"/>
  <text x="386" y="333" class="card-title">Foundry Hosted Agent</text>
  <text x="386" y="358" class="card-title">v11</text>
  <text x="386" y="392" class="card-copy">Shared conversation runtime</text>
  <text x="386" y="416" class="card-copy">Model selects an allowed tool</text>
  <text x="386" y="440" class="card-copy">No customer endpoint or key</text>
  <text x="386" y="464" class="card-copy">is ever available to the model</text>
  <rect x="386" y="482" width="230" height="46" rx="12" fill="#27204e" opacity="0.8"/>
  <text x="401" y="502" class="card-small">Allowed: four exact</text>
  <text x="401" y="520" class="card-small">mcp-oauth___ tool names</text>

  <!-- Toolbox card -->
  <rect x="726" y="260" width="270" height="290" rx="20" fill="url(#toolbox)" class="card"/>
  <text x="756" y="302" class="card-title">Foundry Toolbox</text>
  <text x="756" y="326" class="card-copy">personal-agent-oauth-proof:2</text>
  <text x="756" y="358" class="card-copy">Connection: mcp-oauth</text>
  <text x="756" y="383" class="card-copy">OAuth2 delegated authorization</text>
  <text x="756" y="414" class="card-copy">MCP initialize + tools/list</text>
  <rect x="756" y="432" width="210" height="90" rx="12" fill="#075a96" opacity="0.9"/>
  <text x="771" y="454" class="card-small">Private VNet/DataProxy path</text>
  <text x="771" y="476" class="card-small">Model-facing prefix: mcp-oauth___</text>
  <text x="771" y="498" class="card-small">who_am_i excluded (least priv.)</text>

  <!-- Broker card -->
  <rect x="1082" y="260" width="640" height="290" rx="22" fill="url(#broker)" class="card"/>
  <text x="1118" y="302" class="card-title">Private MCP Broker — FastMCP</text>
  <text x="1118" y="336" class="card-copy">1. Validate RS256 signature, issuer, audience, lifetime</text>
  <text x="1118" y="362" class="card-copy">2. Require delegated scope, tenant ID, and user object ID</text>
  <text x="1118" y="388" class="card-copy">3. Compute SHA256(tid:oid) and resolve customer entitlement</text>
  <text x="1118" y="414" class="card-copy">4. Select server-side endpoint, bearer key, and host policy</text>
  <rect x="1118" y="438" width="290" height="92" rx="14" fill="#8d3b11" opacity="0.85"/>
  <text x="1134" y="460" class="card-small">Broker tool names</text>
  <text x="1134" y="482" class="card-copy">customer_context · run_python</text>
  <text x="1134" y="503" class="card-copy">search_craigslist · browse_url</text>
  <rect x="1424" y="438" width="270" height="92" rx="14" fill="#8d3b11" opacity="0.85"/>
  <text x="1440" y="460" class="card-small">Fail closed</text>
  <text x="1440" y="482" class="card-copy">Unknown identity / invalid host:</text>
  <text x="1440" y="503" class="card-copy">denied. Missing route/key: error</text>

  <!-- Sandboxes -->
  <rect x="1082" y="660" width="300" height="220" rx="20" fill="url(#sandbox)" class="card"/>
  <text x="1114" y="700" class="card-title">Customer Python Sandbox</text>
  <text x="1114" y="728" class="card-copy">customer-personal</text>
  <text x="1114" y="758" class="card-copy">run_python · search_craigslist</text>
  <text x="1114" y="786" class="card-copy">Dedicated bearer key</text>
  <text x="1114" y="808" class="card-copy">Bounded execution and egress</text>
  <text x="1114" y="834" class="card-small">Sandbox ID: ffd11767…ffc</text>

  <rect x="1422" y="660" width="300" height="220" rx="20" fill="url(#sandbox)" class="card"/>
  <text x="1454" y="700" class="card-title">Shared Playwright Workspace</text>
  <text x="1454" y="728" class="card-copy">customer-personal</text>
  <text x="1454" y="758" class="card-copy">curated MCP tools · approval required</text>
  <text x="1454" y="786" class="card-copy">Distinct bearer key</text>
  <text x="1454" y="808" class="card-copy">Read-only browsing policy</text>
  <text x="1454" y="834" class="card-small">ephemeral session · close after use</text>

  <!-- Public destinations -->
  <rect x="1082" y="930" width="640" height="82" rx="18" fill="#59451c" stroke="#ffd166" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="1112" y="962" class="card-title">Approved public web destinations</text>
  <text x="1112" y="987" class="card-copy">Seattle Craigslist pages and images only; HTTPS host validated at broker and Sandbox egress</text>

  <!-- Step 1+2: caller -> agent -> toolbox -->
  <path class="request" d="M270 400 H356"/>
  <rect x="277" y="365" width="72" height="26" rx="8" fill="#86dcff"/>
  <text x="313" y="383" text-anchor="middle" class="tag">① prompt</text>

  <path class="request" d="M646 400 H726"/>
  <rect x="653" y="365" width="90" height="26" rx="8" fill="#86dcff"/>
  <text x="698" y="383" text-anchor="middle" class="tag">② tool call</text>

  <!-- Step 3: toolbox -> broker, routed ABOVE both cards through open header space -->
  <path class="identity" d="M950 260 V210 H1150 V260"/>
  <rect x="965" y="192" width="220" height="26" rx="8" fill="#ffd166"/>
  <text x="1075" y="210" text-anchor="middle" class="tag">③ delegated OAuth token</text>

  <!-- Step 4/5: broker to sandboxes, direct vertical, no crossing elbow -->
  <path class="secret" d="M1232 580 V660"/>
  <rect x="1122" y="592" width="220" height="26" rx="8" fill="#ff8dc7"/>
  <text x="1232" y="610" text-anchor="middle" class="tag">④ Python route + key</text>

  <path class="secret" d="M1572 580 V660"/>
  <rect x="1462" y="592" width="220" height="26" rx="8" fill="#ff8dc7"/>
  <text x="1572" y="610" text-anchor="middle" class="tag">⑤ Separate PWW Toolbox</text>

  <!-- Step 6: sandboxes to public destinations -->
  <path class="web" d="M1232 880 V930"/>
  <path class="web" d="M1572 880 V930"/>
  <rect x="1310" y="888" width="164" height="26" rx="8" fill="#ffd166"/>
  <text x="1392" y="906" text-anchor="middle" class="tag">⑥ allowlisted HTTPS</text>

  <!-- Step 7: return path, broker back to caller, routed low and clear of everything else -->
  <path class="returnpath" d="M1082 500 C 760 660, 500 660, 270 550"/>
  <rect x="560" y="632" width="330" height="30" rx="10" fill="#0d3a2c" stroke="#65e6ae" stroke-width="1.2"/>
  <text x="725" y="653" text-anchor="middle" class="tag" fill="#eafff5">⑦ tool result → model response → caller</text>

  <!-- Legend -->
  <rect x="40" y="1040" width="1720" height="70" rx="16" fill="#081f35" stroke="#315d79"/>
  <line x1="70" y1="1068" x2="120" y2="1068" class="request"/>
  <text x="134" y="1073" class="legend">request / tool arguments</text>
  <line x1="400" y1="1068" x2="450" y2="1068" class="identity"/>
  <text x="464" y="1073" class="legend">delegated identity token</text>
  <line x1="710" y1="1068" x2="760" y2="1068" class="secret"/>
  <text x="774" y="1073" class="legend">server-side Sandbox credential</text>
  <line x1="1100" y1="1068" x2="1150" y2="1068" class="returnpath"/>
  <text x="1164" y="1073" class="legend">returned tool / model data</text>
  <text x="1500" y="1073" class="legend">Active proof: September 11, 2026</text>
</svg>
