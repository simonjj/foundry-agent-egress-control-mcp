<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">Tenant-aware MCP solution call flow</title>
  <desc id="desc">End-to-end runtime flow from an authenticated user through a Microsoft Foundry Hosted Agent, OAuth2 Toolbox, private MCP broker, and customer-specific Python and browser Sandboxes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06172c"/>
      <stop offset="0.55" stop-color="#0a2b49"/>
      <stop offset="1" stop-color="#123f58"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5fc7"/>
      <stop offset="1" stop-color="#7d55d9"/>
    </linearGradient>
    <linearGradient id="toolbox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#00a4ef"/>
    </linearGradient>
    <linearGradient id="broker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c45418"/>
      <stop offset="1" stop-color="#e38b24"/>
    </linearGradient>
    <linearGradient id="sandbox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#008272"/>
      <stop offset="1" stop-color="#00a68a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#00101d" flood-opacity="0.48"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#86dcff"/>
    </marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffd166"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#65e6ae"/>
    </marker>
    <marker id="arrowPink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ff8dc7"/>
    </marker>
    <style>
      .title { font: 700 40px "Segoe UI", Arial, sans-serif; fill: #f7fcff; }
      .subtitle { font: 400 19px "Segoe UI", Arial, sans-serif; fill: #bddced; }
      .zone-title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #cdeeff; letter-spacing: 1.4px; }
      .card-title { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .card-copy { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #e2f2fa; }
      .card-small { font: 600 12px "Segoe UI", Arial, sans-serif; fill: #d4ebf6; }
      .label { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #dff5ff; }
      .legend { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #d4eaf5; }
      .step-text { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #07182e; text-anchor: middle; dominant-baseline: middle; }
      .zone { fill: #0a233b; stroke: #376b89; stroke-width: 2; }
      .card { stroke: #ffffff; stroke-opacity: 0.26; stroke-width: 1.5; filter: url(#shadow); }
      .request { fill: none; stroke: #86dcff; stroke-width: 4; marker-end: url(#arrowBlue); }
      .identity { fill: none; stroke: #ffd166; stroke-width: 4; marker-end: url(#arrowGold); }
      .secret { fill: none; stroke: #ff8dc7; stroke-width: 3.5; marker-end: url(#arrowPink); }
      .return { fill: none; stroke: #65e6ae; stroke-width: 4; stroke-dasharray: 11 8; marker-end: url(#arrowGreen); }
      .web { fill: none; stroke: #ffd166; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrowGold); }
    </style>
  </defs>

  <rect width="1800" height="1160" fill="url(#bg)"/>
  <circle cx="1640" cy="60" r="250" fill="#2d7da0" opacity="0.12"/>
  <circle cx="80" cy="1080" r="290" fill="#7454db" opacity="0.10"/>

  <text x="68" y="65" class="title">Tenant-Aware MCP Solution - Runtime Call Flow</text>
  <text x="68" y="101" class="subtitle">One shared Hosted Agent and Toolbox; the private broker selects the customer route from validated delegated identity</text>

  <rect x="45" y="145" width="260" height="790" rx="26" class="zone"/>
  <text x="72" y="181" class="zone-title">CALLER</text>

  <rect x="335" y="145" width="730" height="790" rx="26" class="zone"/>
  <text x="365" y="181" class="zone-title">MICROSOFT FOUNDRY</text>

  <rect x="1095" y="145" width="660" height="790" rx="26" class="zone"/>
  <text x="1125" y="181" class="zone-title">CUSTOMER-CONTROLLED PRIVATE TOOL PLANE</text>

  <rect x="80" y="310" width="190" height="210" rx="20" fill="#27445d" class="card"/>
  <circle cx="175" cy="363" r="28" fill="#d9edff"/>
  <circle cx="175" cy="354" r="10" fill="#27445d"/>
  <path d="M153 385 Q175 361 197 385" stroke="#27445d" stroke-width="8" fill="none" stroke-linecap="round"/>
  <text x="175" y="426" text-anchor="middle" class="card-title">Authenticated user</text>
  <text x="175" y="456" text-anchor="middle" class="card-copy">Foundry playground</text>
  <text x="175" y="478" text-anchor="middle" class="card-copy">or Responses client</text>
  <text x="175" y="501" text-anchor="middle" class="card-small">Interactive OAuth consent</text>

  <rect x="380" y="270" width="285" height="270" rx="22" fill="url(#agent)" class="card"/>
  <text x="413" y="316" class="card-title">Foundry Hosted Agent v11</text>
  <text x="413" y="351" class="card-copy">Shared conversation runtime</text>
  <text x="413" y="376" class="card-copy">Model selects an allowed tool</text>
  <text x="413" y="401" class="card-copy">No customer endpoint or key</text>
  <text x="413" y="426" class="card-copy">is available to the model</text>
  <rect x="413" y="458" width="217" height="52" rx="13" fill="#27204e" opacity="0.78"/>
  <text x="429" y="479" class="card-small">Allowed: four exact</text>
  <text x="429" y="498" class="card-small">mcp-oauth___ tool names</text>

  <rect x="730" y="245" width="290" height="320" rx="22" fill="url(#toolbox)" class="card"/>
  <text x="765" y="291" class="card-title">Foundry Toolbox</text>
  <text x="765" y="320" class="card-title">personal-agent-oauth-proof:2</text>
  <text x="765" y="356" class="card-copy">Connection: mcp-oauth</text>
  <text x="765" y="381" class="card-copy">OAuth2 delegated authorization</text>
  <text x="765" y="406" class="card-copy">MCP initialize and tools/list</text>
  <text x="765" y="431" class="card-copy">Private VNet/DataProxy path</text>
  <rect x="765" y="459" width="220" height="76" rx="13" fill="#075a96" opacity="0.88"/>
  <text x="782" y="481" class="card-small">Model-facing prefix:</text>
  <text x="782" y="502" class="card-small">mcp-oauth___</text>
  <text x="782" y="523" class="card-small">who_am_i excluded</text>

  <rect x="1140" y="220" width="570" height="330" rx="24" fill="url(#broker)" class="card"/>
  <text x="1177" y="267" class="card-title">Private MCP Broker - FastMCP</text>
  <text x="1177" y="300" class="card-copy">1. Validate RS256 signature, issuer, audience, lifetime</text>
  <text x="1177" y="327" class="card-copy">2. Require delegated scope, tenant ID, and user object ID</text>
  <text x="1177" y="354" class="card-copy">3. Compute SHA256(tid:oid) and resolve customer entitlement</text>
  <text x="1177" y="381" class="card-copy">4. Select server-side endpoint, bearer key, and host policy</text>
  <rect x="1177" y="412" width="238" height="102" rx="15" fill="#8d3b11" opacity="0.83"/>
  <text x="1195" y="436" class="card-small">Broker tool names</text>
  <text x="1195" y="460" class="card-copy">customer_context</text>
  <text x="1195" y="482" class="card-copy">run_python / search_craigslist</text>
  <text x="1195" y="504" class="card-copy">browse_url</text>
  <rect x="1440" y="412" width="232" height="102" rx="15" fill="#8d3b11" opacity="0.83"/>
  <text x="1458" y="436" class="card-small">Fail closed</text>
  <text x="1458" y="460" class="card-copy">Unknown identity: denied</text>
  <text x="1458" y="482" class="card-copy">Invalid host: denied</text>
  <text x="1458" y="504" class="card-copy">Missing route/key: error</text>

  <rect x="1128" y="620" width="270" height="235" rx="22" fill="url(#sandbox)" class="card"/>
  <text x="1160" y="663" class="card-title">Customer Python Sandbox</text>
  <text x="1160" y="693" class="card-copy">customer-personal</text>
  <text x="1160" y="728" class="card-copy">run_python</text>
  <text x="1160" y="753" class="card-copy">search_craigslist</text>
  <text x="1160" y="786" class="card-copy">Dedicated bearer key</text>
  <text x="1160" y="811" class="card-copy">Bounded execution and egress</text>
  <text x="1160" y="836" class="card-small">Sandbox ID: ffd11767...ffc</text>

  <rect x="1430" y="620" width="270" height="235" rx="22" fill="url(#sandbox)" class="card"/>
  <text x="1462" y="663" class="card-title">Customer Browser Sandbox</text>
  <text x="1462" y="693" class="card-copy">customer-personal</text>
  <text x="1462" y="728" class="card-copy">browser_navigate</text>
  <text x="1462" y="753" class="card-copy">browser_snapshot</text>
  <text x="1462" y="786" class="card-copy">Distinct bearer key</text>
  <text x="1462" y="811" class="card-copy">Read-only browsing policy</text>
  <text x="1462" y="836" class="card-small">Sandbox ID: 0f23c1bf...722</text>

  <rect x="1175" y="985" width="475" height="92" rx="20" fill="#59451c" stroke="#ffd166" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1208" y="1024" class="card-title">Approved public web destinations</text>
  <text x="1208" y="1053" class="card-copy">Seattle Craigslist pages and images only; HTTPS host validation at broker and Sandbox egress</text>

  <circle cx="323" cy="390" r="18" fill="#86dcff"/>
  <text x="323" y="390" class="step-text">1</text>
  <path d="M270 405 C315 405 330 405 380 405" class="request"/>
  <text x="286" y="378" class="label">prompt</text>

  <circle cx="697" cy="390" r="18" fill="#86dcff"/>
  <text x="697" y="390" class="step-text">2</text>
  <path d="M665 405 H730" class="request"/>
  <text x="676" y="365" class="label">tool selection</text>

  <circle cx="1059" cy="326" r="18" fill="#ffd166"/>
  <text x="1059" y="326" class="step-text">3</text>
  <path d="M1020 350 C1068 350 1092 350 1140 350" class="identity"/>
  <text x="1026" y="302" class="label">delegated OAuth token</text>
  <text x="1038" y="323" class="label">private DataProxy</text>

  <circle cx="1425" cy="580" r="18" fill="#ffd166"/>
  <text x="1425" y="580" class="step-text">4</text>
  <path d="M1425 550 V610" class="identity"/>
  <text x="1455" y="585" class="label">resolved customer route</text>

  <circle cx="1265" cy="585" r="18" fill="#ff8dc7"/>
  <text x="1265" y="585" class="step-text">5</text>
  <path d="M1300 550 C1265 575 1263 585 1263 620" class="secret"/>
  <text x="1135" y="579" class="label">Python key</text>

  <circle cx="1575" cy="585" r="18" fill="#ff8dc7"/>
  <text x="1575" y="585" class="step-text">6</text>
  <path d="M1545 550 C1570 575 1565 590 1565 620" class="secret"/>
  <text x="1595" y="579" class="label">Browser key</text>

  <circle cx="1415" cy="914" r="18" fill="#ffd166"/>
  <text x="1415" y="914" class="step-text">7</text>
  <path d="M1263 855 C1263 930 1325 950 1370 985" class="web"/>
  <path d="M1565 855 C1565 930 1500 950 1458 985" class="web"/>
  <text x="1442" y="935" class="label">allowlisted HTTPS</text>

  <circle cx="693" cy="710" r="18" fill="#65e6ae"/>
  <text x="693" y="710" class="step-text">8</text>
  <path d="M1140 590 C1015 710 700 735 270 535" class="return"/>
  <text x="625" y="680" class="label">tool result -> model response -> caller</text>

  <rect x="45" y="1097" width="1710" height="43" rx="14" fill="#081f35" stroke="#315d79"/>
  <line x1="75" y1="1119" x2="125" y2="1119" class="request"/>
  <text x="140" y="1124" class="legend">request/tool arguments</text>
  <line x1="355" y1="1119" x2="405" y2="1119" class="identity"/>
  <text x="420" y="1124" class="legend">delegated identity token</text>
  <line x1="650" y1="1119" x2="700" y2="1119" class="secret"/>
  <text x="715" y="1124" class="legend">server-side Sandbox credential</text>
  <line x1="1010" y1="1119" x2="1060" y2="1119" class="return"/>
  <text x="1075" y="1124" class="legend">returned tool/model data</text>
  <text x="1365" y="1124" class="legend">Active proof: September 11, 2026</text>
</svg>
