# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: financial-services-customer-scenario-day3-agent
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  craigslist-agent:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Responses Protocol
        - MCP
        - ACA Sandboxes
        - Code Interpreter
        - Azure API Management
        - Web Search
        - Browser Automation
    project: src/agent
    language: python
    docker:
      path: Dockerfile
      remoteBuild: true
    uses:
      - ai-project
    kind: hosted
    name: craigslist-agent
    displayName: Financial Services Customer Scenario Day 3 Reference Agent
    description: Routes model and Bing-backed web-search traffic through APIM and uses ACA Sandbox plus Playwright Workspace tools.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      APIM_FOUNDRY_PROJECT_ENDPOINT: ${APIM_FOUNDRY_PROJECT_ENDPOINT}
      APIM_SUBSCRIPTION_KEY: ${APIM_SUBSCRIPTION_KEY}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME=gpt-5.4-mini}
      MCP_SERVER_URL: ${MCP_SERVER_URL}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      PLAYWRIGHT_CONNECTION_ID: ${PLAYWRIGHT_CONNECTION_ID}
      ENABLE_INSTRUMENTATION: 'true'
      ENABLE_SENSITIVE_DATA: 'true'
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRIC_EXPORT_INTERVAL: '10000'
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: terraform
  path: infrastructure/terraform
